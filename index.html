<body>
<style>
/* Layout: 社工工作台——左側流程導覽，右側單一工作區；狀態用藍（AI）／金（人工）／綠（自動）三色標記 */
:root{
  --bg:#F3F4F2; --panel:#FFFFFF; --panel-2:#F7F8F6; --line:#DCE0DA; --line-2:#E8EBE6;
  --fg:#18222F; --fg-2:#4A5563; --fg-3:#6B7480;
  --nav:#1E3F6E; --nav-fg:#FFFFFF;
  --ai:#2A5CA8; --ai-bg:#E6EEF9; --human:#A8770F; --human-bg:#FBF1D6; --auto:#2D7A4E; --auto-bg:#E2F2E8;
  --hi:#2D7A4E; --hi-bg:#E2F2E8; --mid:#9A6E0C; --mid-bg:#FBF1D6; --low:#B5481F; --low-bg:#FBE6DC;
  --warn-bg:#FFF5E8; --warn-line:#F0C98A; --mark:#FFF3B8; --shadow:0 1px 2px rgba(24,34,47,.06);
  --font:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Mono CJK TC',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --panel:#1A2230; --panel-2:#1F2938; --line:#2E3A4C; --line-2:#263142;
  --fg:#E8ECF2; --fg-2:#B7C0CD; --fg-3:#8E99A8; --nav:#22477C; --nav-fg:#FFFFFF;
  --ai:#8DB4F0; --ai-bg:#1E3352; --human:#E7C066; --human-bg:#3A3018; --auto:#7FCB9C; --auto-bg:#1B3628;
  --hi:#7FCB9C; --hi-bg:#1B3628; --mid:#E7C066; --mid-bg:#3A3018; --low:#F09A78; --low-bg:#43261C;
  --warn-bg:#33291A; --warn-line:#6E5525; --mark:#4A4320; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --panel:#1A2230; --panel-2:#1F2938; --line:#2E3A4C; --line-2:#263142;
  --fg:#E8ECF2; --fg-2:#B7C0CD; --fg-3:#8E99A8; --nav:#22477C; --nav-fg:#FFFFFF;
  --ai:#8DB4F0; --ai-bg:#1E3352; --human:#E7C066; --human-bg:#3A3018; --auto:#7FCB9C; --auto-bg:#1B3628;
  --hi:#7FCB9C; --hi-bg:#1B3628; --mid:#E7C066; --mid-bg:#3A3018; --low:#F09A78; --low-bg:#43261C;
  --warn-bg:#33291A; --warn-line:#6E5525; --mark:#4A4320; --shadow:none; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--nav);color:var(--nav-fg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand small{color:var(--fg-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow:auto;flex:1}
.nav .grp{font-size:12px;color:var(--fg-3);padding:6px 10px 2px;letter-spacing:.06em}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:15px}

.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--nav);color:var(--nav-fg)}
.nav a.on .n{border-color:rgba(255,255,255,.6);color:var(--nav-fg)}

.tally{border-top:1px solid var(--line);padding:14px 18px 18px;font-size:13px;color:var(--fg-2)}
.tally .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 10px;background:var(--line-2)}
.tally .bar i{display:block}
.tally .row{display:flex;justify-content:space-between;padding:2px 0}
.tally .row b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{color:var(--fg-2);font-size:14px;flex:1;min-width:0}
.crumb b{color:var(--fg);font-weight:500}

.who{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.who i{width:28px;height:28px;border-radius:50%;background:var(--ai-bg);color:var(--ai);display:grid;place-items:center;font-style:normal;font-weight:700}
.view{flex:1;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 28px 24px;min-height:0}
.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:24px;line-height:1.3;margin:0 0 4px;text-wrap:balance}
.head p{margin:0;color:var(--fg-2);max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:16px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.g2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}

.t-ai{background:var(--ai-bg);color:var(--ai)} .t-hu{background:var(--human-bg);color:var(--human)} .t-au{background:var(--auto-bg);color:var(--auto)}
.t-hi{background:var(--hi-bg);color:var(--hi)} .t-mid{background:var(--mid-bg);color:var(--mid)} .t-low{background:var(--low-bg);color:var(--low)}
.t-off{background:var(--line-2);color:var(--fg-3);text-decoration:line-through}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--nav);border-color:var(--nav);color:var(--nav-fg)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--nav);color:var(--nav-fg)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--fg-3);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px;font-size:14px}
.alert b{display:block}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scroll-x{overflow-x:auto}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.file{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;background:var(--panel-2);border-radius:8px}

.prog i{display:block;height:100%;background:var(--ai);width:100%;transition:width .5s}
/* visit */

.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--nav);color:var(--nav-fg);font-size:14px;flex:none}
.wave{flex:1;min-width:160px;height:34px;display:flex;align-items:center;gap:2px;cursor:pointer}
.wave i{flex:1;background:var(--line);border-radius:2px}
.wave i.p{background:var(--ai)}
.tr{display:flex;flex-direction:column;gap:2px;max-height:none}
.ln{display:grid;grid-template-columns:62px 52px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:8px;font-size:14.5px;cursor:pointer}
.ln:hover{background:var(--panel-2)}
.ln.cur{background:var(--ai-bg)}
.ln.flash{background:var(--mark)}
.ln .tc{font-family:var(--mono);font-size:12.5px;color:var(--fg-3);padding-top:2px}
.ln .sp{font-size:13px;color:var(--fg-3)}
.ln .sp.c{color:var(--ai);font-weight:500}
.mask{background:var(--line-2);border-radius:4px;padding:0 4px;font-size:13px;color:var(--fg-2)}
.ex{display:flex;flex-direction:column;gap:8px}
.exi{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--panel)}
.exi:hover{background:var(--panel-2)}
.exi .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.exi p{margin:2px 0 0;font-size:14.5px}
.exi .meta{font-size:12.5px;color:var(--fg-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exi.hi{border-left-color:var(--hi)} .exi.mid{border-left-color:var(--mid)} .exi.low{border-left-color:var(--low)}
/* status review */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.sec h3{font-size:13px;color:var(--fg-3);margin:14px 0 6px;font-weight:500;letter-spacing:.06em}
.it{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.it.done{background:var(--panel-2)}
.it .txt{font-size:15px}
.it .txt textarea{width:100%;min-height:58px;border:1px solid var(--ai);border-radius:6px;padding:6px 8px;background:var(--panel);resize:vertical}
.it .why{font-size:12.5px;color:var(--fg-3);margin-top:3px}
.it .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.it .stt{font-size:13px;white-space:nowrap}
.src{font-family:var(--mono);font-size:12px;color:var(--ai);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
.manual{display:grid;gap:12px}
.manual label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2)}
.manual select,.manual textarea{border:1px solid var(--warn-line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:14px}
.manual textarea{min-height:76px;resize:vertical}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-2)}
.meter i{display:block;transition:width .3s}
.big{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1.1}
.diff{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border-radius:8px;padding:10px 12px;max-height:180px;overflow:auto;white-space:pre-wrap}
/* geno */
.geno svg{width:100%;height:auto;display:block}
.geno .node{cursor:pointer}
.geno .node:hover .shape,.geno .node.sel .shape{stroke:var(--ai);stroke-width:4}
.gtext{font-family:var(--font);fill:var(--fg)}
.gsub{font-family:var(--font);fill:var(--fg-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
pre.json{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border-radius:8px;padding:10px 12px;overflow:auto;max-height:230px;margin:0}
/* referral */
.consent label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-2);border-left:4px solid transparent}
.fld.ai{border-left-color:var(--ai)} .fld.hu{border-left-color:var(--human)} .fld.au{border-left-color:var(--auto)} .fld.off{border-left-color:var(--line);color:var(--fg-3)}
.fld .k{font-size:14px} .fld .k small{display:block;color:var(--fg-3);font-size:12px}
.fld .v{font-size:14.5px} .fld .v small{display:block;color:var(--fg-3);font-size:12px;margin-top:2px}
.fld.off .v{text-decoration:line-through}
.fld .v textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--warn-line);border-radius:6px;padding:5px 8px;background:var(--panel)}
.check{display:flex;flex-direction:column;gap:6px;font-size:14px}
.check div{display:flex;gap:8px}
.ok{color:var(--auto)} .ng{color:var(--low)}
.tl{display:flex;flex-direction:column;gap:0;margin-top:6px}
.tl div{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--auto);display:block;margin-left:3px}
.tl i.w{background:var(--line)}
.link{font-family:var(--mono);font-size:13px;background:var(--panel-2);padding:8px 10px;border-radius:8px;word-break:break-all}
/* export */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:14px;text-align:left}
.tabs button small{display:block;color:var(--fg-3);font-size:12px}
.tabs button.on{border-color:var(--nav);box-shadow:inset 0 0 0 1px var(--nav)}
.map{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) auto;gap:6px 8px;font-size:14px;align-items:center}
.map .arrow{color:var(--fg-3);text-align:center}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi small{color:var(--fg-2);font-size:13px;display:block}
.kpi .big{margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.pipe>div{padding:10px 12px;border-right:1px solid var(--line-2)}
.pipe>div:last-child{border-right:0}
.pipe b{display:block;font-family:var(--mono);font-size:20px}
.pipe .barh{height:6px;background:var(--ai);border-radius:3px;margin-top:6px;opacity:.85}
.chart svg{width:100%;height:auto;display:block}
.al{display:flex;flex-direction:column;gap:8px}
.al div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.sev{width:8px;height:28px;border-radius:3px;display:block}
@media (max-width:1100px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3>.c3{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-left:0}
  .brand{padding:12px max(16px,env(safe-area-inset-left,0px)) 6px}
  .nav{flex-direction:row;overflow-x:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;flex:none}

  .nav a{white-space:nowrap;flex:none}
  .tally{display:none}
  .g2,.g3{grid-template-columns:1fr}

  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

 {t:'00:00:15',s:'社工',x:'阿桃姨您好，我是isnt的王社工。今天想聊聊您最近的生活，談話會錄音，只用來整理紀錄，可以嗎？'},

const PG_CACHE={};
function pgRows(k){
  if(PG_CACHE[k]) return PG_CACHE[k];
  const P=PROGS[k]; let seed=k.length*9973+P.n; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const SN=['陳','林','黃','張','李','王','吳','劉','蔡','楊','許','鄭','謝','郭','洪','曾','邱','廖','賴','周'];
  const GE=['秀英','美玉','金枝','麗華','春嬌','玉蘭','月娥','阿滿','清水','金龍','文雄','國華','明德','阿土','進財','寶珠','素珍','碧霞','錦雲','福來'];
  const GK=['小安','小傑','小涵','小恩','小軒','小妤','小翔','小琪','小睿','小芸','小哲','小媛'];
  const rows=PG_REAL[k].map(r=>({real:true,name:r[0],age:r[1],hh:r[2],owner:r[3],st:r[4],next:r[5],rem:r[6],other:r[7],link:r[8]}));
  for(let i=rows.length;i<P.n;i++){
    const s=pick(SN), fam=k==='fam';
    const name=fam?`${s}家（${pick(['母＋1','母＋2','父＋1','祖孫 2 人','雙親＋3'])}）`:s+pick(k==='kid'||k==='care'?GK:GE);
    const age=fam?'':k==='kid'?6+Math.floor(rnd()*7):k==='care'?1+Math.floor(rnd()*5):65+Math.floor(rnd()*25);
    const d=23+Math.floor(rnd()*28), next=d<=31?`10/${d}`:`11/${String(d-31).padStart(2,'0')}`;
    rows.push({name,age,hh:`F115-${String(1000+Math.floor(rnd()*8999))}`,owner:pick(P.staff),st:pick(P.st),next:k==='kid'?pick(['每週一三五','每週二四','每週一至五']):next,rem:pick(P.rem),other:pick(P.other)});
  }
  const key=r=>{const m=/^(\d+)\/(\d+)$/.exec(r.next);return m?(+m[1])*100+(+m[2]):9999};
  const real=rows.filter(r=>r.real), rest=rows.filter(r=>!r.real).sort((a,b)=>key(a)-key(b));
  return PG_CACHE[k]=[...real,...rest];
}
